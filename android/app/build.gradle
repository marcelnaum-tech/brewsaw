plugins {
    id 'com.android.application'
}

// Signaturschlüssel: liegt nur lokal (android/keystore.properties ist nicht im Repository)
def keystoreProps = new Properties()
def keystoreDatei = rootProject.file('keystore.properties')
if (keystoreDatei.exists()) {
    keystoreDatei.withInputStream { keystoreProps.load(it) }
}

def host = project.property('brewsawHost')
def pfad = project.property('brewsawPfad')

android {
    namespace 'app.brewsaw.twa'
    compileSdk 35

    defaultConfig {
        applicationId project.property('brewsawAppId')
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'

        manifestPlaceholders = [
            hostName  : host,
            pfad      : pfad,
            defaultUrl: "https://${host}${pfad}",
        ]
        // Verknüpfung App <-> Website (Gegenstück: /.well-known/assetlinks.json auf dem Host)
        resValue 'string', 'asset_statements',
            '[{ \\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], ' +
            '\\"target\\": { \\"namespace\\": \\"web\\", \\"site\\": \\"https://' + host + '\\" } }]'
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
